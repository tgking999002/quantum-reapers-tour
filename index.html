<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUANTUM REAPERS TOUR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090a10;color:white;font-family:Arial}
header{padding:18px;background:#141620;color:#f22b49;font-weight:bold}
main{max-width:650px;margin:auto;padding:20px}
.card{background:#171a25;padding:20px;border-radius:12px;margin:18px 0}
input{width:100%;padding:13px;margin:8px 0;background:#0b0d14;color:white;border:1px solid #444;border-radius:7px}
button{padding:12px 18px;background:#e51d3d;color:white;border:0;border-radius:7px;margin:5px;cursor:pointer}
.muted{color:#aaa;font-size:14px}
#message{color:#ff6078}
</style>
</head>
<body>
<header>☠ QUANTUM REAPERS TOUR</header>
<main>
<div class="card">
<h2>Welcome, Warrior!</h2>
<p class="muted">Official Free Fire Tournament Platform</p>
<p id="userStatus">Not logged in</p>
</div>

<div class="card">
<h2>Player Account</h2>
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password (minimum 6 characters)">
<button id="signup">Create Account</button>
<button id="login">Login</button>
<button id="logout">Logout</button>
<p id="message"></p>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyAssl38GQP9PXeIwkilKlr9IzWS8JSoctA",
 authDomain: "qrt-1025b.firebaseapp.com",
 databaseURL: "https://qrt-1025b-default-rtdb.firebaseio.com",
 projectId: "qrt-1025b",
 storageBucket: "qrt-1025b.firebasestorage.app",
 messagingSenderId: "1043110837806",
 appId: "1:1043110837806:web:78803e518bfacce781e9bf",
 measurementId: "G-W6028P7WN9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");
const userStatus = document.getElementById("userStatus");

document.getElementById("signup").onclick = async () => {
 try {
  await createUserWithEmailAndPassword(auth,email.value,password.value);
  message.textContent = "Account created successfully!";
 } catch(e) {
  message.textContent = e.message;
 }
};

document.getElementById("login").onclick = async () => {
 try {
  await signInWithEmailAndPassword(auth,email.value,password.value);
  message.textContent = "Login successful!";
 } catch(e) {
  message.textContent = e.message;
 }
};

document.getElementById("logout").onclick = async () => {
 try {
  await signOut(auth);
  message.textContent = "Logged out!";
 } catch(e) {
  message.textContent = e.message;
 }
};

onAuthStateChanged(auth,user => {
 userStatus.textContent = user ? "Logged in: " + user.email : "Not logged in";
});
</script>
</body>
</html>
